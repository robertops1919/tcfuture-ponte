<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TCFuture ponte</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="p"></div>
<script>
/*
 * Ponte do YouTube para o TCFuture Painel na TV.
 * Um app instalado na TV não tem endereço de origem, e o YouTube recusa o player (erro 153).
 * Esta página tem endereço, carrega o player e avisa o painel o que acontece com o vídeo.
 * Uso: ?v=<id do vídeo>&mute=1
 */
(function () {
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    var a = kv.split('=');
    if (a[0]) q[a[0]] = decodeURIComponent(a[1] || '');
  });
  var video = /^[\w-]{11}$/.test(q.v || '') ? q.v : '';
  var muted = q.mute !== '0';
  var player = null;

  function tell(m) { try { parent.postMessage(JSON.stringify(m), '*'); } catch (e) {} }
  if (!video) { tell({ev: 'error', data: 'sem-video'}); return; }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('p', {
      videoId: video,
      playerVars: {autoplay: 1, mute: muted ? 1 : 0, controls: 0, disablekb: 1, modestbranding: 1,
                   rel: 0, playsinline: 1, hl: 'pt-BR'},
      events: {
        onReady: function (e) { if (muted) e.target.mute(); e.target.playVideo(); tell({ev: 'ready'}); },
        onStateChange: function (e) { tell({ev: 'state', data: e.data}); },
        onError: function (e) { tell({ev: 'error', data: e.data}); }
      }
    });
  };

  // Ordens do painel: som ligado ou desligado.
  window.addEventListener('message', function (e) {
    if (e.source !== parent || !player || !player.mute) return;
    var m;
    try { m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
    if (!m) return;
    if (m.cmd === 'mute') player.mute();
    else if (m.cmd === 'unmute') { player.unMute(); player.setVolume(100); }
    else if (m.cmd === 'play') player.playVideo();
  });

  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function () { tell({ev: 'error', data: 'api'}); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
